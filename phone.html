<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="소프트웨어공학 수업 발표용 Google Calendar 개선 프로토타입. 모든 데이터는 브라우저 안에서만 동작합니다."
    />
    <title>Google Calendar</title>
    <link rel="icon" href="./assets/calendar.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/embedded.css" />
    <script defer src="./js/icons.js"></script>
    <script defer src="./js/data.js"></script>
    <script defer src="./js/map.js"></script>
    <script defer src="./js/app.js"></script>
  </head>
  <body class="embedded">
    <section class="device" aria-label="Google Calendar 모바일 프로토타입">
      <div class="status-bar" aria-hidden="true">
        <span class="status-time"
          >1:03
          <svg viewBox="0 0 20 20">
            <path d="M4 8a6 6 0 0 1 10-4M16 8v4l2 3H5M8 18h4M2 2l16 16" /></svg
        ></span>
        <span class="status-right"
          ><span class="signal"><i></i><i></i><i></i><i></i></span><b>5G</b
          ><span class="battery"></span
        ></span>
      </div>
      <div id="app" class="app"></div>
      <div id="overlay" class="overlay-root"></div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div class="home-indicator" aria-hidden="true"></div>
    </section>
  </body>
</html>
